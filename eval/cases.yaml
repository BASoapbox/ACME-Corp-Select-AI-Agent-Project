# Evaluation cases for the ACME Select AI Agent.
#
# Scoring is deliberately not "does the text look right". Each case can assert:
#
#   verify_sql       SQL returning the ground truth. The answer must contain that
#                    value. Because the expected figure is computed at run time,
#                    the case never goes stale when the data changes.
#   must_include     every string must appear (case-insensitive)
#   must_not_match   regex that must NOT appear
#   expect_refusal   the answer must decline rather than produce a figure
#   expect_tools     every tool listed must have fired for this exact run
#   forbid_tools     none of these may have fired
#   max_seconds      wall-clock budget
#   known_failure    documented current defect; counted separately so it does not
#                    hide a NEW regression
#
# Tool attribution is exact: RUN_TEAM returns a team_exec_id and
# USER_AI_AGENT_TOOL_HISTORY records it, so there is no time-window guessing.

defaults:
  max_seconds: 30

cases:

  # ---------- SQL: figures that must come from the ledger ----------
  - id: sql-engineering-aug2025
    category: sql
    question: What were total Engineering expenses in August 2025?
    verify_sql: |
      SELECT TO_CHAR(SUM(t.debit_amount))
      FROM   acme_gl_transactions t
      JOIN   acme_departments d ON d.department_code = t.department_code
      WHERE  d.department_name = 'Engineering' AND t.period_name = 'AUG-2025'
    expect_tools: [ACME_SQL_TOOL]

  - id: sql-sales-jun2025
    category: sql
    question: What were total Sales expenses in June 2025?
    verify_sql: |
      SELECT TO_CHAR(SUM(t.debit_amount))
      FROM   acme_gl_transactions t
      JOIN   acme_departments d ON d.department_code = t.department_code
      WHERE  d.department_name = 'Sales' AND t.period_name = 'JUN-2025'
    expect_tools: [ACME_SQL_TOOL]

  - id: sql-lines-aug2025
    category: sql
    question: How many journal lines posted in AUG-2025?
    verify_sql: |
      SELECT TO_CHAR(COUNT(*)) FROM acme_gl_transactions WHERE period_name = 'AUG-2025'
    expect_tools: [ACME_SQL_TOOL]

  - id: sql-top-department-q3
    category: sql
    question: Which department spent the most between July and September 2025?
    verify_sql: |
      SELECT department_name FROM (
        SELECT d.department_name
        FROM   acme_gl_transactions t
        JOIN   acme_departments d ON d.department_code = t.department_code
        WHERE  t.period_name IN ('JUL-2025','AUG-2025','SEP-2025')
        GROUP  BY d.department_name
        ORDER  BY SUM(t.debit_amount) DESC)
      WHERE ROWNUM = 1
    expect_tools: [ACME_SQL_TOOL]

  - id: sql-period-count
    category: sql
    question: How many distinct accounting periods are in the general ledger?
    verify_sql: |
      SELECT TO_CHAR(COUNT(DISTINCT period_name)) FROM acme_gl_transactions
    expect_tools: [ACME_SQL_TOOL]

  # ---------- Groundedness: the agent must refuse, not invent ----------
  - id: refusal-empty-department
    category: groundedness
    question: How much did Europe HQ spend in 2025?
    expect_refusal: true
    # A NON-ZERO money figure: $-prefixed, comma-grouped, or 5+ digits.
    # Deliberately does not match a bare 4-digit year ("spending in 2025"), nor
    # an explicit $0 — reporting zero is the correct grounded answer here.
    must_not_match: '\$\s?[1-9]|\b[1-9]\d{0,2}(?:,\d{3})+\b|\b[1-9]\d{4,}\b'
    comment: >
      Europe HQ exists in ACME_DEPARTMENTS with zero transactions. A model
      answering from plausibility invents a number; the correct answer is that
      there is no data.

  - id: refusal-absent-department
    category: groundedness
    question: What did the Facilities department spend in 2025?
    expect_refusal: true
    must_not_match: '\$\s?[1-9]|\b[1-9]\d{0,2}(?:,\d{3})+\b|\b[1-9]\d{4,}\b'

  # ---------- RAG: answers must come from the policy documents ----------
  - id: rag-cfo-threshold
    category: rag
    question: Which transactions require CFO sign-off?
    must_include: ['50,000']
    expect_tools: [ACME_RAG_TOOL]

  - id: rag-close-checklist
    category: rag
    question: What are the steps in the period close checklist?
    must_include: ['Fusion', 'reconciliation', 'approval']
    expect_tools: [ACME_RAG_TOOL]

  # ---------- Custom tools: the right tool must do the work ----------
  - id: tool-anomaly-threshold
    category: tools
    question: Which periods show unusual spending above a 30 percent threshold?
    must_include: ['Engineering', 'AUG-2025']
    expect_tools: [ACME_ANOMALY_TOOL]

  - id: tool-forecast-engineering
    category: tools
    question: Forecast Engineering spend for the next three periods.
    must_match: '\d[\d,]*\.?\d*'
    expect_tools: [ACME_FORECAST_TOOL]

  - id: tool-trend-engineering
    category: tools
    question: How have Engineering expenses trended over the last six periods?
    expect_tools: [ACME_TREND_TOOL]

  - id: tool-python-stddev-engineering
    category: tools
    question: Give me the standard deviation and peak period for Engineering.
    verify_sql: |
      SELECT TO_CHAR(ROUND(STDDEV_POP(total), 2)) FROM (
        SELECT SUM(t.debit_amount) AS total
        FROM   acme_gl_transactions t
        JOIN   acme_departments d ON d.department_code = t.department_code
        WHERE  d.department_name = 'Engineering'
        GROUP  BY t.period_name)
    must_include: ['AUG-2025']
    expect_tools: [ACME_PYTHON_TOOL]
    max_seconds: 120
    comment: >
      numpy.std is the population standard deviation, so the SQL ground truth
      must use STDDEV_POP and not STDDEV.

  - id: tool-python-stddev-sales
    category: tools
    question: Give me the standard deviation and peak period for Sales.
    verify_sql: |
      SELECT TO_CHAR(ROUND(STDDEV_POP(total), 2)) FROM (
        SELECT SUM(t.debit_amount) AS total
        FROM   acme_gl_transactions t
        JOIN   acme_departments d ON d.department_code = t.department_code
        WHERE  d.department_name = 'Sales'
        GROUP  BY t.period_name)
    expect_tools: [ACME_PYTHON_TOOL]
    max_seconds: 120

  # ---------- Routing: questions needing two tools in sequence ----------
  - id: route-overspend-policy
    category: routing
    question: Engineering is over budget - what does policy say about overspend approval?
    must_include: ['approval']
    expect_tools: [ACME_RAG_TOOL]

  - id: route-anomaly-not-forecast
    category: routing
    question: Is Engineering spending in AUG-2025 anomalous, and what approval does policy require?
    forbid_tools: [ACME_FORECAST_TOOL]
    repeat: 5
    min_passes: 5
    known_failure: true
    comment: >
      AUG-2025 is already in the ledger, so this is never a forecast question,
      yet the forecast tool fires anyway - measured 0/5 on the shipped
      instructions. Three rewrites of the tool and task instructions were tried
      and every one made something else worse: naming "past periods" inside the
      forecast tool's own instruction made it match past-period lookups
      (sql-sales-jun2025 went 5/5 to 0/5), and restating the routing rules in
      the agent role was worse still. All were reverted. The defect is narrow
      and cosmetic in effect - the anomaly tool does fire and the answer is
      still grounded - so it is declared rather than chased.

  - id: route-anomaly-then-policy
    category: routing
    question: Is Engineering spending in AUG-2025 anomalous, and what approval does policy require?
    expect_tools: [ACME_ANOMALY_TOOL, ACME_RAG_TOOL]
    repeat: 5
    min_passes: 4
    comment: >
      Two-tool decomposition on the shipped instructions: both the anomaly tool
      and the policy documents are reached, measured 5/5. Sampled five times
      because it is the kind of case that degrades quietly when instructions
      change.
