version: 2

# GitGuardian / ggshield configuration for this repository.
#
# Every script here is parameterised with SQLcl substitution variables, which
# use a caret prefix (SET DEFINE '^'). A line such as
#
#     password => '^schema_pw.'
#
# is a *variable reference*, not a credential — the value is supplied at run
# time from SA_ENV.sql, which is gitignored and never committed. The generic
# password detector cannot tell the two apart. If it flags one, record that
# match under secret.ignored_matches as an accepted false positive rather than
# silencing the scan with SKIP=ggshield.
#
# The one such match recorded here (SA_03's '^schema_pw.') was removed when the
# scripts stopped handling the schema password at all: the database reads it
# from OCI Vault instead.
#
# No real password, key, OCID or token belongs in this repository. If a new
# finding appears, check it properly before adding it here.

secret:
  ignored_paths:
    # Local, gitignored config that holds real values. Listed defensively so a
    # stray copy is never scanned or committed.
    - "SA_ENV.sql"
